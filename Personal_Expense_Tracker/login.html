<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <div class="background-globes">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
    </div>

    <div class="container auth-container">
        <header class="auth-header">
            <h1>Welcome Back</h1>
            <p>Login to manage your finances</p>
        </header>

        <div class="card auth-card">
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-icon">
                        <i class="fas fa-user"></i>  <!--fa-user shoes user icon-->
                        <input type="text" id="username" placeholder="Enter username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>  <!--fas is font awesome solid fa-lock shoes lock itemc -->
                        <input type="password" id="password" placeholder="Enter password" required>
                    </div>
                </div>
<!-- .error-message {
    color: var(--danger-color);
    font-size: 0.9rem;
    margin-bottom: 1rem;
} -->
                <div id="auth-error" class="error-message hidden"></div>

                <button type="submit" class="btn-primary auth-btn">
                    Login <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
                <p><a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const result = auth.login(username, password);
            //success means true or false
            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                const errorDiv = document.getElementById('auth-error');
                errorDiv.textContent = result.message;
                errorDiv.classList.remove('hidden');
            }
        });
        
// const result = auth.login(username, password);
// - Credentials validation: It takes the username and password you typed in.

    </script>
</body>

</html>
